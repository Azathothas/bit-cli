[package]
name = "bit-cli-core"
description = "Engine, web seed addressing, and metainfo handling for bit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["torrent", "bittorrent", "webseed", "bep19", "download"]
categories = ["network-programming"]
publish = false

[lib]
name = "bit_cli_core"
path = "src/lib.rs"

[features]
default = ["dht", "pex", "lsd", "upnp"]
dht = []
pex = []
lsd = []
upnp = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
globset.workspace = true
hdrhistogram.workspace = true
ignore.workspace = true
librqbit.workspace = true
librqbit-bencode.workspace = true
librqbit-core.workspace = true
librqbit-peer-protocol.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs", "test-util"] }

# The signing and redirect routing in the file server is logic, not plumbing,
# and a fixture that answers 403 when it should not would fail a download and
# look like a defect in `bit-cli`. `test = true` puts its unit tests in
# `cargo test --workspace` alongside everything else.
[[example]]
name = "loopback-fileserver"
test = true

# Same reason as above: the handshake bytes and the hex decoding are logic, and
# a churn generator that sends a malformed handshake would measure the far
# side refusing it rather than the far side leaking a socket.
[[example]]
name = "loopback-churn"
test = true
