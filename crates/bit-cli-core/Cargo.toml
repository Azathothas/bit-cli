[package]
name = "bit-cli-core"
description = "Engine, web seed addressing, and metainfo handling for bit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["torrent", "bittorrent", "webseed", "bep19", "download"]
categories = ["network-programming"]
publish = false

[lib]
name = "bit_cli_core"
path = "src/lib.rs"

[features]
default = ["dht", "pex", "lsd", "upnp"]
dht = []
pex = []
lsd = []
upnp = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
globset.workspace = true
hdrhistogram.workspace = true
ignore.workspace = true
librqbit.workspace = true
librqbit-bencode.workspace = true
librqbit-core.workspace = true
librqbit-peer-protocol.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs", "test-util"] }
