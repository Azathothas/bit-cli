# Static CRT on Windows so the released binary has no VCRUNTIME140.dll or
# api-ms-win-crt-* dependency and runs on a machine with no redistributable
# installed. Verify with `dumpbin /dependents` or the check in
# scripts/check-static.ps1.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# musl is statically linked by default, but say so rather than relying on it.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
