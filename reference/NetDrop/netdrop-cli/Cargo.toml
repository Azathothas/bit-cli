[package]
name = "netdrop"
version.workspace = true
edition.workspace = true
description = "netdrop CLI — zero-knowledge P2P file transfer (SmartNet iroh stack)"

[[bin]]
name = "netdrop"
path = "src/main.rs"

[dependencies]
netdrop-core = { path = "../netdrop-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util"] }
tar = "0.4"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
anyhow = "1"
