name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. Every job gets read access and no more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # The TLS and SHA-1 backends assemble their own primitives, and NASM is
      # not on the Windows runner by default.
      # Pinned: v1.5.2 is the newest release and still runs on node20, so the
      # runner warns about it. Revisit when upstream ships a node24 build.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --locked --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The rust-version in Cargo.toml is the edition 2024 minimum. This job
      # is what stops it drifting: a dependency that needs something newer
      # fails here rather than in a user's build.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --workspace --locked --all-features

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # A release binary that needs a Visual C++ redistributable is a release
      # binary that fails to start on a clean machine, with a dialog box rather
      # than an error a script can read.
      - name: Check static CRT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-static.ps1 -Path "target/${{ matrix.target }}/release/bit-cli.exe"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # bit-cli is MIT. A transitive copyleft dependency is a licence incident,
      # not a lint, so this job is what stops one arriving unnoticed.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses advisories bans sources

  determinism:
    name: Create determinism
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
      # The same payload has to produce a byte-identical .torrent on both
      # platforms. Path separator and ordering bugs are exactly what this
      # catches, and they only show up across platforms.
      - name: Build a fixture torrent
        shell: bash
        run: |
          mkdir -p fixture/sub
          printf 'one' > fixture/a.bin
          printf 'two' > fixture/sub/b.bin
          cargo run --locked --quiet -- create fixture \
            --no-creation-date --no-created-by --sort-by path:ascending \
            --piece-length 16KiB -o fixture.torrent
      - name: Record the hash
        shell: bash
        run: sha256sum fixture.torrent | cut -d' ' -f1 > hash.txt && cat hash.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: determinism-${{ matrix.os }}
          path: hash.txt
          retention-days: 1

  determinism-compare:
    name: Compare determinism hashes
    runs-on: ubuntu-latest
    needs: determinism
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: hashes
      - name: The two platforms must agree
        shell: bash
        run: |
          linux=$(cat hashes/determinism-ubuntu-latest/hash.txt)
          windows=$(cat hashes/determinism-windows-latest/hash.txt)
          echo "linux:   $linux"
          echo "windows: $windows"
          test "$linux" = "$windows"
